name: Build

on:
    push:
    pull_request:
    workflow_dispatch:
        inputs:
            sdrpp_ref:
                description: "SDR++ branch, tag or commit to build against (must match the SDR++ build that will load the plugin)"
                required: false
                default: "master"

env:
    SDRPP_REF: ${{ inputs.sdrpp_ref || 'master' }}

jobs:
    build_windows:
        runs-on: windows-latest

        steps:
        - name: Checkout plugin
          uses: actions/checkout@v4
          with:
              path: plugin

        - name: Checkout SDR++
          uses: actions/checkout@v4
          with:
              repository: AlexandreRouma/SDRPlusPlus
              ref: ${{ env.SDRPP_REF }}
              path: SDRPlusPlus

        # Same dependency setup as SDR++'s own Windows build (only what sdrpp_core needs)
        - name: Download PothosSDR
          run: Invoke-WebRequest -Uri "https://downloads.myriadrf.org/builds/PothosSDR/PothosSDR-2020.01.26-vc14-x64.exe" -OutFile ${{runner.workspace}}/pothos.exe

        - name: Install PothosSDR
          run: mkdir "C:/Program Files/PothosSDR" ; 7z x ${{runner.workspace}}/pothos.exe -o"C:/Program Files/PothosSDR/"

        - name: Install vcpkg dependencies
          run: vcpkg install fftw3:x64-windows glfw3:x64-windows zstd:x64-windows

        - name: Configure
          run: cmake -S plugin -B build "-DSDRPP_SOURCE_DIR=$Env:GITHUB_WORKSPACE/SDRPlusPlus" "-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake"

        - name: Build
          run: cmake --build build --config Release --target mpx_analyzer

        - name: Package
          run: |
            mkdir dist
            cp build/Release/mpx_analyzer.dll dist/
            cp plugin/README.md, plugin/LICENSE dist/
            "Built against SDR++ commit $(git -C SDRPlusPlus rev-parse HEAD) ($(git -C SDRPlusPlus log -1 --format=%cd --date=iso))" | Out-File -Encoding utf8 dist/SDRPP_VERSION.txt
            Get-Content dist/SDRPP_VERSION.txt

        - name: Upload
          uses: actions/upload-artifact@v4
          with:
              name: mpx_analyzer_windows_x64
              path: dist/

    build_linux:
        runs-on: ubuntu-latest

        steps:
        - name: Checkout plugin
          uses: actions/checkout@v4
          with:
              path: plugin

        - name: Checkout SDR++
          uses: actions/checkout@v4
          with:
              repository: AlexandreRouma/SDRPlusPlus
              ref: ${{ env.SDRPP_REF }}
              path: SDRPlusPlus

        - name: Install dependencies
          run: sudo apt-get update && sudo apt-get install -y build-essential cmake pkg-config libfftw3-dev libvolk-dev libglfw3-dev libzstd-dev libgl-dev

        - name: Configure
          run: cmake -S plugin -B build -DSDRPP_SOURCE_DIR=$GITHUB_WORKSPACE/SDRPlusPlus

        - name: Build
          run: cmake --build build -j$(nproc) --target mpx_analyzer

    # Same runners, dependencies and deployment target as SDR++'s own macOS builds
    build_macos:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - runner: macos-15-intel
                      arch: intel
                    - runner: macos-15
                      arch: arm
        runs-on: ${{ matrix.runner }}

        steps:
        - name: Checkout plugin
          uses: actions/checkout@v4
          with:
              path: plugin

        - name: Checkout SDR++
          uses: actions/checkout@v4
          with:
              repository: AlexandreRouma/SDRPlusPlus
              ref: ${{ env.SDRPP_REF }}
              path: SDRPlusPlus

        - name: Install dependencies
          run: brew install pkg-config fftw glfw zstd && pip3 install mako --break-system-packages

        - name: Install volk
          run: git clone --recursive https://github.com/gnuradio/volk && cd volk && mkdir build && cd build && cmake -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15 -DCMAKE_BUILD_TYPE=Release .. && make -j3 && sudo make install

        - name: Configure
          run: cmake -S plugin -B build "-DSDRPP_SOURCE_DIR=$GITHUB_WORKSPACE/SDRPlusPlus" -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15 -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DUSE_BUNDLE_DEFAULTS=ON "-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-dead_strip_dylibs"

        - name: Build
          run: cmake --build build -j3 --target mpx_analyzer

        - name: Download SDR++ nightly (for the library check)
          continue-on-error: true
          run: curl -fL -o sdrpp_nightly.zip "https://github.com/AlexandreRouma/SDRPlusPlus/releases/download/nightly/sdrpp_macos_${{ matrix.arch }}.zip"

        - name: Package
          run: |
            bash plugin/.github/scripts/macos_package.sh build/mpx_analyzer.dylib dist sdrpp_nightly.zip
            cp plugin/README.md plugin/LICENSE dist/
            echo "Built against SDR++ commit $(git -C SDRPlusPlus rev-parse HEAD) ($(git -C SDRPlusPlus log -1 --format=%cd --date=iso))" > dist/SDRPP_VERSION.txt
            cat dist/SDRPP_VERSION.txt

        - name: Upload
          uses: actions/upload-artifact@v4
          with:
              name: mpx_analyzer_macos_${{ matrix.arch }}
              path: dist/

    # ---- SDR# plugin (sdrsharp/) ----

    # DSP checks with synthetic FM signals, no SDR# needed
    test_sdrsharp_dsp:
        runs-on: ubuntu-latest

        steps:
        - name: Checkout plugin
          uses: actions/checkout@v4

        - name: Set up .NET
          uses: actions/setup-dotnet@v4
          with:
              dotnet-version: "8.0.x"

        - name: Run DSP tests
          run: dotnet run -c Release --project sdrsharp/tests/MpxTests.csproj

    # Builds against the current SDR# release, then loads the plugin with SDR#'s own assemblies (smoke test)
    build_sdrsharp:
        runs-on: windows-latest

        steps:
        - name: Checkout plugin
          uses: actions/checkout@v4

        - name: Download SDR#
          run: |
            Invoke-WebRequest -Uri "https://airspy.com/downloads/sdrsharp-x64.zip" -OutFile sdrsharp.zip -UserAgent "Mozilla/5.0"
            "Downloaded $((Get-Item sdrsharp.zip).Length) bytes"
            Expand-Archive sdrsharp.zip -DestinationPath sdrsharp_dist
            Get-ChildItem sdrsharp_dist -Recurse -File | Sort-Object Length -Descending | Select-Object -First 40 | Format-Table Length, FullName -AutoSize | Out-String -Width 300

        # Newer SDR# builds may be published as a single-file bundle, with the assemblies inside the exe
        - name: Extract SDR# bundle (if needed)
          run: |
            if (-not (Get-ChildItem sdrsharp_dist -Recurse -Filter SDRSharp.Common.dll)) {
                $exe = Get-ChildItem sdrsharp_dist -Recurse -Filter SDRSharp.exe | Select-Object -First 1
                if (-not $exe) { throw "Neither SDRSharp.Common.dll nor SDRSharp.exe found in the SDR# download" }
                dotnet tool install -g sfextract
                sfextract $exe.FullName -o "$($exe.DirectoryName)"
                Get-ChildItem $exe.DirectoryName -Filter "SDRSharp*" | Format-Table Length, Name -AutoSize
            }

        # The plugin must target the same .NET version as SDR#
        - name: Find SDR# version
          id: sdrsharp
          run: |
            $common = Get-ChildItem sdrsharp_dist -Recurse -Filter SDRSharp.Common.dll | Select-Object -First 1
            if (-not $common) { throw "SDRSharp.Common.dll not found in the SDR# download" }
            $dir = $common.DirectoryName
            $rc = Get-ChildItem $dir -Filter "SDRSharp*.runtimeconfig.json" | Select-Object -First 1
            if ($rc) {
                $tfm = (Get-Content $rc.FullName | ConvertFrom-Json).runtimeOptions.tfm -replace '-windows.*', ''
            }
            else {
                # No runtimeconfig (e.g. single-file bundle): read the target framework from SDRSharp.Common.dll
                $bytes = [IO.File]::ReadAllBytes($common.FullName)
                $text = [Text.Encoding]::ASCII.GetString($bytes)
                $m = [regex]::Match($text, '\.NETCoreApp,Version=v(\d+\.\d+)')
                if (-not $m.Success) { throw "Can't tell which .NET version SDR# uses" }
                $tfm = "net$($m.Groups[1].Value)"
            }
            $exe = Get-ChildItem $dir -Filter "SDRSharp*.exe" | Select-Object -First 1
            $ver = if ($exe) { $exe.VersionInfo.FileVersion } else { "unknown" }
            "SDR# $ver ($tfm) in $dir"
            "dir=$dir" >> $Env:GITHUB_OUTPUT
            "tfm=$tfm-windows" >> $Env:GITHUB_OUTPUT
            "dotnet=$($tfm.Substring(3)).x" >> $Env:GITHUB_OUTPUT
            "version=$ver" >> $Env:GITHUB_OUTPUT

        - name: Set up .NET
          uses: actions/setup-dotnet@v4
          with:
              dotnet-version: ${{ steps.sdrsharp.outputs.dotnet }}

        - name: Build
          run: dotnet build sdrsharp/SDRSharp.MPXAnalyzer.csproj -c Release "-p:SdrSharpDir=${{ steps.sdrsharp.outputs.dir }}" "-p:TargetFramework=${{ steps.sdrsharp.outputs.tfm }}" -o sdrsharp_build

        - name: Smoke test
          run: |
            dotnet build sdrsharp/smoketest/SmokeTest.csproj -c Release "-p:SdrSharpDir=${{ steps.sdrsharp.outputs.dir }}" "-p:TargetFramework=${{ steps.sdrsharp.outputs.tfm }}" -o smoketest_build
            $p = Start-Process smoketest_build/SmokeTest.exe -ArgumentList "`"${{ steps.sdrsharp.outputs.dir }}`"", "`"$PWD/smoketest_out`"" -Wait -PassThru -NoNewWindow -RedirectStandardOutput smoketest.log
            Get-Content smoketest.log
            if ($p.ExitCode -ne 0) { throw "Smoke test failed" }

        - name: Package
          run: |
            mkdir dist
            cp sdrsharp_build/SDRSharp.MPXAnalyzer.dll dist/
            cp sdrsharp/README.md, LICENSE dist/
            "Built against SDR# ${{ steps.sdrsharp.outputs.version }} (${{ steps.sdrsharp.outputs.tfm }})" | Out-File -Encoding utf8 dist/SDRSHARP_VERSION.txt
            Get-Content dist/SDRSHARP_VERSION.txt

        - name: Upload
          uses: actions/upload-artifact@v4
          with:
              name: mpx_analyzer_sdrsharp
              path: dist/

        - name: Upload smoke test screenshots
          if: always()
          uses: actions/upload-artifact@v4
          with:
              name: sdrsharp_smoketest_screenshots
              path: smoketest_out/
              if-no-files-found: ignore

    # Pushing a version tag (e.g. v0.2.0) publishes the builds as a GitHub Release
    release:
        if: startsWith(github.ref, 'refs/tags/v')
        needs: [build_windows, build_linux, build_macos, build_sdrsharp, test_sdrsharp_dsp]
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
        - name: Download builds
          uses: actions/download-artifact@v4
          with:
              path: artifacts

        - name: Zip builds
          run: |
            mkdir release
            rm -rf artifacts/sdrsharp_smoketest_screenshots
            for DIR in artifacts/mpx_analyzer_*; do
                NAME=$(basename "$DIR")
                (cd "$DIR" && zip -r "$GITHUB_WORKSPACE/release/${NAME}_${GITHUB_REF_NAME}.zip" .)
            done
            ls -l release

        - name: Write release notes
          run: |
            SDRPP=$(cat artifacts/mpx_analyzer_windows_x64/SDRPP_VERSION.txt | tr -d '\r\n' | sed 's/^\xEF\xBB\xBF//')
            cat > notes.md << EOF
            **${SDRPP}.** The plugin must be used with a matching SDR++ build, e.g. an SDR++ nightly from around the same date.

            | Download | Platform | Install |
            |---|---|---|
            | \`mpx_analyzer_windows_x64_${GITHUB_REF_NAME}.zip\` | Windows 64-bit | Copy \`mpx_analyzer.dll\` into SDR++'s \`modules\` folder |
            | \`mpx_analyzer_macos_arm_${GITHUB_REF_NAME}.zip\` | Mac, Apple Silicon | \`xattr -d com.apple.quarantine mpx_analyzer.dylib\`, then copy it to \`/Applications/SDR++.app/Contents/Plugins/\` |
            | \`mpx_analyzer_macos_intel_${GITHUB_REF_NAME}.zip\` | Mac, Intel | As above |
            | \`mpx_analyzer_sdrsharp_${GITHUB_REF_NAME}.zip\` | SDR# (Windows) | Copy \`SDRSharp.MPXAnalyzer.dll\` into SDR#'s \`Plugins\` folder. $(cat artifacts/mpx_analyzer_sdrsharp/SDRSHARP_VERSION.txt | tr -d '\r\n' | sed 's/^\xEF\xBB\xBF//') |

            Linux: build from source, see the README. Then start SDR++ and add an \`mpx_analyzer\` instance in Module Manager.
            EOF
            sed -i 's/^ *//' notes.md
            cat notes.md

        - name: Publish release
          env:
              GH_TOKEN: ${{ github.token }}
          run: |
            # Update the release if one already exists for this tag (e.g. created on the website first)
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
                gh release upload "$GITHUB_REF_NAME" release/*.zip --clobber --repo "$GITHUB_REPOSITORY"
            else
                gh release create "$GITHUB_REF_NAME" release/*.zip --repo "$GITHUB_REPOSITORY" --title "MPX Analyzer $GITHUB_REF_NAME" --notes-file notes.md
            fi
